name: CI

# Doteď v repu neběžel jediný automatický test — jediný workflow byl
# mirror do veřejného repa, který kód nijak nekontroluje. Regrese se tak
# daly odhalit leda ručním proklikáním. Tenhle workflow to mění.
on:
  push:
    branches: [claude/palm-reading-library-bsvvnl]
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Bez env proměnných — ověřuje se tím zároveň, že aplikace jde
      # postavit na čistém nasazení, kde uživatel nenastaví nic.
      - name: Instalace
        run: npm ci

      - name: Typová kontrola
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build
